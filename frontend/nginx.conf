# a named upstream reuses connections to Go: keepalive is the default since nginx 1.29.7
upstream backend {
    server backend:8080;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types application/javascript text/css application/json;

    location /api/ {
        # no trailing slash: the full path reaches Go
        proxy_pass http://backend;
    }

    # webpack puts a content hash in the bundle name, so a browser can keep it for good
    location ~ "\.[0-9a-f]{20}\.js$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
